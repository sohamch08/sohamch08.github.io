baseURL = "https://sohamch08.github.io/"
locale = "en"
title = "Soham Chatterjee"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
enableGitInfo = true

[params]
  description = "A minimal, responsive and feature-rich Jekyll theme for technical writing."
  theme_mode = "dark"
  avatar = "/assets/img/profile.jpg"
  email = "soham.chatterjee@tifr.res.in"
  github = "sohamch08"
  twitter = "soham.chatterjee.123"
  copyright_url = "https://twitter.com/username"
  pwa = true

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.typographer]
  disable = true

[outputs]
  home = ["HTML", "Atom"]

[mediaTypes."application/atom+xml"]
  suffixes = ["xml"]

[outputFormats.Atom]
  mediaType = "application/atom+xml"
  baseName = "feed"
  isPlainText = false

[sitemap]
  changeFreq = ""
  priority = -1

[build]
  noJSConfigInAssets = true

# Mount custom styles and scripts as Hugo resources so live preview invalidates
# fingerprinted assets when their source files change.
[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static/assets/css"
  target = "assets/css"

[[module.mounts]]
  source = "static/assets/js"
  target = "assets/js"

# Keep LaTeX intact when rendering Markdown, including inside shortcodes.
[markup.goldmark.extensions.passthrough]
  enable = true
[markup.goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)'], ['$', '$']]
