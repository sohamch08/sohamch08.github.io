{{ range $id, $key := hugo.Data.public_keys }}
<li class="lookup-key-row">
  <span class="lookup-icon"><i class="{{ if eq $id "gpg" }}fa-solid fa-fingerprint{{ else }}fa-solid fa-key{{ end }}" aria-hidden="true"></i></span>
  <span>My {{ $key.title }} <button type="button" class="lookup-key-copy" data-key-copy-target="sidebar-{{ $id }}-key" data-key-title="{{ $key.title }}" aria-label="Copy {{ $key.title }}" title="Copy {{ $key.title }}" aria-describedby="sidebar-key-status" hidden><i class="fa-regular fa-copy" aria-hidden="true"></i></button></span>
</li>
{{ end }}
