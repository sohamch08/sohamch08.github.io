<!doctype html>
<html lang="{{ site.Language.Locale }}" data-mode="{{ site.Params.theme_mode }}">
  {{ partial "head.html" . }}
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "sidebar.html" . }}
    <div id="main-wrapper" class="site-wrapper">
      {{ partial "topbar.html" . }}
      <main id="main-content" aria-label="Main Content">
        {{ block "main" . }}{{ end }}
      </main>
      <aside aria-label="Scroll to Top">
        <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M6 15L12 9L18 15"></path></svg>
        </button>
      </aside>
    </div>
    <div id="mask" class="d-none position-fixed w-100 h-100 z-1"></div>
    {{ if site.Params.pwa }}{{ partial "notification.html" . }}{{ end }}
  </body>
</html>
